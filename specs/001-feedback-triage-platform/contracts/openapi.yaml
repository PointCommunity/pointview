openapi: 3.1.0
info:
  title: PointView HTTP API
  version: 1.0.0
  description: >-
    Authenticated feedback intake and operations API. Cloudflare Access authenticates
    the edge request; PointView sessions and database roles authorize every resource.
    Triage and retention run as local CLI commands and are intentionally not exposed
    as public HTTP mutations.
servers:
  - url: https://pointview-canary.eaglepass.io
    description: Canary
  - url: https://pointview.eaglepass.io
    description: Production
tags:
  - name: Launch
  - name: Feedback
  - name: Administration
  - name: Operations
paths:
  /launch:
    post:
      tags: [Launch]
      summary: Verify and consume a signed source-app launch context
      operationId: consumeLaunch
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [launch_token]
              properties:
                launch_token:
                  type: string
                  minLength: 40
                  maxLength: 8192
      responses:
        "303":
          description: Launch accepted; a short-lived server-side launch session cookie is set.
          headers:
            Location:
              schema: { type: string, const: /feedback/new }
            Set-Cookie:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/feedback:
    get:
      tags: [Feedback]
      summary: List feedback visible to the current account
      operationId: listFeedback
      security: [{ pointviewSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Cursor-paginated feedback summaries. Users receive only their own records.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FeedbackSummary" }
                  next_cursor: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Feedback]
      summary: Create one feedback record from the consumed launch session
      operationId: createFeedback
      security: [{ pointviewSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [feedback, privacy_acknowledged]
              properties:
                feedback:
                  type: string
                  minLength: 1
                  maxLength: 20000
                privacy_acknowledged:
                  type: boolean
                  const: true
                screenshots:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                    format: binary
            encoding:
              screenshots:
                contentType: image/png, image/jpeg, image/webp
      responses:
        "201":
          description: Durable queued feedback record
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/feedback/{feedbackId}:
    parameters:
      - $ref: "#/components/parameters/FeedbackId"
    get:
      tags: [Feedback]
      summary: Get one authorized feedback record and sanitized triage status
      operationId: getFeedback
      security: [{ pointviewSession: [] }]
      responses:
        "200":
          description: Feedback detail; operator-only evidence is omitted for Users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Feedback]
      summary: Withdraw and erase an owned queued, unleased record
      operationId: withdrawFeedback
      security: [{ pointviewSession: [], csrfToken: [] }]
      responses:
        "204": { description: Raw payload and screenshots deleted; content-free tombstone retained. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/feedback/{feedbackId}/attachments/{attachmentId}:
    parameters:
      - $ref: "#/components/parameters/FeedbackId"
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Feedback]
      summary: Retrieve a normalized screenshot after resource authorization
      operationId: getAttachment
      security: [{ pointviewSession: [] }]
      responses:
        "200":
          description: Normalized image bytes
          headers:
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/admin/accounts:
    get:
      tags: [Administration]
      summary: List accounts for Admin/Owner review
      operationId: listAccounts
      security: [{ pointviewSession: [] }]
      responses:
        "200":
          description: Account list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Account" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/admin/accounts/{accountId}:
    patch:
      tags: [Administration]
      summary: Approve, suspend, or change a non-protected account role
      operationId: updateAccount
      security: [{ pointviewSession: [], csrfToken: [] }]
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role: { enum: [USER, ADMIN, OWNER] }
                status: { enum: [PENDING, ACTIVE, SUSPENDED] }
              minProperties: 1
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/admin/source-apps:
    get:
      tags: [Administration]
      summary: List registered source apps
      operationId: listSourceApps
      security: [{ pointviewSession: [] }]
      responses:
        "200":
          description: Source-app registrations without key or secret material
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SourceApp" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Administration]
      summary: Register a source app (Owner only)
      operationId: createSourceApp
      security: [{ pointviewSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceAppInput" }
      responses:
        "201":
          description: Disabled registration pending validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceApp" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/admin/source-apps/{sourceAppId}:
    patch:
      tags: [Administration]
      summary: Version and validate source-app configuration (Owner only)
      operationId: updateSourceApp
      security: [{ pointviewSession: [], csrfToken: [] }]
      parameters:
        - name: sourceAppId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SourceAppInput"
                - type: object
                  properties:
                    enabled: { type: boolean }
                    paused: { type: boolean }
      responses:
        "200":
          description: Validated current registration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceApp" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/admin/settings:
    get:
      tags: [Administration]
      summary: Get sanitized effective settings (Owner only)
      operationId: getSettings
      security: [{ pointviewSession: [] }]
      responses:
        "200":
          description: Effective settings without secret values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "403": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [Administration]
      summary: Create a new effective settings version (Owner only)
      operationId: updateSettings
      security: [{ pointviewSession: [], csrfToken: [] }]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsInput" }
      responses:
        "200":
          description: New effective settings version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "403": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/admin/model-profiles:
    get:
      tags: [Administration]
      summary: List sanitized model profiles (Owner only)
      operationId: listModelProfiles
      security: [{ pointviewSession: [] }]
      responses:
        "200":
          description: Versioned profiles with external secret references but no secret values
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModelProfile" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Administration]
      summary: Create a disabled model profile (Owner only)
      operationId: createModelProfile
      security: [{ pointviewSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelProfileInput" }
      responses:
        "201":
          description: New disabled profile pending validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelProfile" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/admin/model-profiles/{profileId}:
    patch:
      tags: [Administration]
      summary: Version, validate, enable, or disable a model profile (Owner only)
      operationId: updateModelProfile
      security: [{ pointviewSession: [], csrfToken: [] }]
      parameters:
        - name: profileId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ModelProfileInput"
                - type: object
                  properties:
                    enabled: { type: boolean }
      responses:
        "200":
          description: Current sanitized profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelProfile" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/admin/triage-batches:
    get:
      tags: [Operations]
      summary: List batch health and outcomes for Admin/Owner
      operationId: listTriageBatches
      security: [{ pointviewSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Sanitized queue and batch observability
          content:
            application/json:
              schema:
                type: object
                required: [queue, batches]
                properties:
                  queue: { $ref: "#/components/schemas/QueueHealth" }
                  batches:
                    type: array
                    items: { $ref: "#/components/schemas/TriageBatch" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/admin/feedback/{feedbackId}/requeue:
    post:
      tags: [Operations]
      summary: Requeue a Needs Attention record after corrective action
      operationId: requeueFeedback
      security: [{ pointviewSession: [], csrfToken: [] }]
      parameters:
        - $ref: "#/components/parameters/FeedbackId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "202": { description: Record returned to its stable oldest-first queue position. }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/admin/feedback/{feedbackId}/annotations:
    post:
      tags: [Operations]
      summary: Append a correction or operational note without changing raw feedback
      operationId: appendFeedbackAnnotation
      security: [{ pointviewSession: [], csrfToken: [] }]
      parameters:
        - $ref: "#/components/parameters/FeedbackId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, body]
              properties:
                kind: { enum: [CORRECTION, OPERATIONAL_NOTE] }
                body: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "201":
          description: Append-only annotation created and audited
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/health:
    get:
      tags: [Operations]
      summary: Liveness check with no dependency or secret detail
      operationId: health
      security: []
      responses:
        "200":
          description: Process alive
          content:
            application/json:
              schema:
                type: object
                properties: { status: { const: ok } }
                required: [status]
  /api/ready:
    get:
      tags: [Operations]
      summary: Readiness check with only aggregate dependency state
      operationId: ready
      security: []
      responses:
        "200": { description: Required dependencies are usable. }
        "503": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    pointviewSession:
      type: apiKey
      in: cookie
      name: __Host-pointview_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 500 }
    FeedbackId:
      name: feedbackId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
  responses:
    Problem:
      description: Problem Details response with no sensitive internals
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Request limit exceeded for the trusted account/source key
      headers:
        Retry-After:
          required: true
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, correlation_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        correlation_id: { type: string, format: uuid }
    FeedbackSummary:
      type: object
      additionalProperties: false
      required: [id, source_app, context, state, submitted_at, raw_delete_after]
      properties:
        id: { type: string, format: uuid }
        source_app: { type: string }
        context: { type: string }
        state: { enum: [QUEUED, LEASED, RESEARCHING, DECIDING, APPLYING, TRIAGED, NEEDS_ATTENTION, WITHDRAWN] }
        submitted_at: { type: string, format: date-time }
        raw_delete_after: { type: [string, "null"], format: date-time }
    FeedbackDetail:
      allOf:
        - $ref: "#/components/schemas/FeedbackSummary"
        - type: object
          properties:
            feedback: { type: [string, "null"], description: Null after retention/withdrawal or when role is not authorized. }
            attachments:
              type: array
              items:
                type: object
                required: [id, media_type, size_bytes, width, height]
                properties:
                  id: { type: string, format: uuid }
                  media_type: { enum: [image/png, image/jpeg, image/webp] }
                  size_bytes: { type: integer, minimum: 1, maximum: 10485760 }
                  width: { type: integer, minimum: 1 }
                  height: { type: integer, minimum: 1 }
            units:
              type: array
              items:
                type: object
                required: [id, title, state]
                properties:
                  id: { type: string, format: uuid }
                  title: { type: string }
                  state: { type: string }
                  disposition: { type: [string, "null"], enum: [MERGED, CREATED, CONSIDERED, null] }
                  github_url: { type: [string, "null"], format: uri }
            operator_detail:
              oneOf:
                - $ref: "#/components/schemas/OperatorDetail"
                - type: "null"
              description: Present only for authorized Admin/Owner accounts.
    Account:
      type: object
      additionalProperties: false
      required: [id, display_name, role, status, version]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        role: { enum: [USER, ADMIN, OWNER] }
        status: { enum: [PENDING, ACTIVE, SUSPENDED] }
        version: { type: integer, minimum: 1 }
    OperatorDetail:
      type: object
      additionalProperties: false
      required: [evidence, decisions, github_operations, leases, annotations]
      properties:
        evidence:
          type: array
          items:
            type: object
            required: [id, kind, title, locator, captured_at, digest]
            properties:
              id: { type: string }
              kind: { type: string }
              title: { type: string }
              locator: { type: string }
              captured_at: { type: string, format: date-time }
              digest: { type: string }
        decisions:
          type: array
          items:
            type: object
            required: [unit_id, disposition, confidence, reason_code, evidence_ids]
            properties:
              unit_id: { type: string, format: uuid }
              disposition: { enum: [MERGED, CREATED, CONSIDERED] }
              confidence: { type: number, minimum: 0, maximum: 1 }
              reason_code: { type: string }
              evidence_ids: { type: array, items: { type: string } }
        github_operations:
          type: array
          items:
            type: object
            required: [id, step, state, readback_at]
            properties:
              id: { type: string, format: uuid }
              step: { type: string }
              state: { type: string }
              readback_at: { type: [string, "null"], format: date-time }
        leases:
          type: array
          items:
            type: object
            required: [attempt, result, acquired_at]
            properties:
              attempt: { type: integer, minimum: 1 }
              result: { type: [string, "null"] }
              acquired_at: { type: string, format: date-time }
        annotations:
          type: array
          items:
            type: object
            required: [id, kind, body, created_at]
            properties:
              id: { type: string, format: uuid }
              kind: { enum: [CORRECTION, OPERATIONAL_NOTE] }
              body: { type: string }
              created_at: { type: string, format: date-time }
    SourceAppInput:
      type: object
      additionalProperties: false
      required: [slug, display_name, github_owner, github_repo, github_project_node_id, github_project_number, github_installation_id, allowed_origins, return_url_prefixes, governed_labels, public_keys]
      properties:
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$" }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        github_owner: { type: string, minLength: 1, maxLength: 100 }
        github_repo: { type: string, minLength: 1, maxLength: 100 }
        github_project_node_id: { type: string }
        github_project_number: { type: integer, minimum: 1 }
        github_installation_id: { type: integer, minimum: 1 }
        allowed_origins:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uri }
        return_url_prefixes:
          type: array
          uniqueItems: true
          items: { type: string, format: uri }
        governed_labels:
          type: array
          minItems: 5
          uniqueItems: true
          items: { type: string, pattern: "^(type|area):[a-z0-9][a-z0-9-]{0,49}$" }
        public_keys:
          type: array
          minItems: 1
          items:
            type: object
            required: [kid, jwk, not_before, not_after]
            properties:
              kid: { type: string, minLength: 1, maxLength: 100 }
              jwk: { type: object, description: Public Ed25519 JWK only. }
              not_before: { type: string, format: date-time }
              not_after: { type: string, format: date-time }
    SourceApp:
      allOf:
        - $ref: "#/components/schemas/SourceAppInput"
        - type: object
          required: [id, enabled, paused, version, validation]
          properties:
            id: { type: string, format: uuid }
            enabled: { type: boolean }
            paused: { type: boolean }
            version: { type: integer, minimum: 1 }
            validation:
              type: object
              required: [status, checked_at]
              properties:
                status: { enum: [VALID, INVALID, UNKNOWN] }
                checked_at: { type: [string, "null"], format: date-time }
    SettingsInput:
      type: object
      additionalProperties: false
      properties:
        triage_paused: { type: boolean }
        model_profile_id: { type: string, format: uuid }
        risk_review_enabled: { type: boolean }
        raw_retention_days: { type: integer, minimum: 180, maximum: 3650 }
      minProperties: 1
    ModelProfileInput:
      type: object
      additionalProperties: false
      required: [name, provider, model, reasoning_effort, timeout_seconds, max_input_tokens, max_output_tokens, external_secret_ref]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        provider: { enum: [OPENAI] }
        model: { type: string, minLength: 1, maxLength: 120 }
        reasoning_effort: { enum: [none, minimal, low, medium, high, xhigh] }
        timeout_seconds: { type: integer, minimum: 10, maximum: 3600 }
        max_input_tokens: { type: integer, minimum: 1000, maximum: 1000000 }
        max_output_tokens: { type: integer, minimum: 500, maximum: 100000 }
        external_secret_ref:
          type: string
          pattern: "^[A-Za-z0-9._/-]{1,200}$"
          description: Reference name/key only; the secret value is never accepted by this API.
    ModelProfile:
      type: object
      additionalProperties: false
      required: [id, name, provider, model, reasoning_effort, timeout_seconds, max_input_tokens, max_output_tokens, external_secret_ref, enabled, version, validation_status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        provider: { enum: [OPENAI] }
        model: { type: string }
        reasoning_effort: { enum: [none, minimal, low, medium, high, xhigh] }
        timeout_seconds: { type: integer }
        max_input_tokens: { type: integer }
        max_output_tokens: { type: integer }
        external_secret_ref: { type: string }
        enabled: { type: boolean }
        version: { type: integer, minimum: 1 }
        validation_status: { enum: [VALID, INVALID, UNKNOWN] }
    Settings:
      allOf:
        - $ref: "#/components/schemas/SettingsInput"
        - type: object
          required: [version, effective_from]
          properties:
            version: { type: integer, minimum: 1 }
            effective_from: { type: string, format: date-time }
    QueueHealth:
      type: object
      required: [queued, oldest_queued_at, needs_attention, last_successful_batch_at]
      properties:
        queued: { type: integer, minimum: 0 }
        oldest_queued_at: { type: [string, "null"], format: date-time }
        needs_attention: { type: integer, minimum: 0 }
        last_successful_batch_at: { type: [string, "null"], format: date-time }
    TriageBatch:
      type: object
      required: [id, state, started_at, records_attempted, records_completed, records_needs_attention]
      properties:
        id: { type: string, format: uuid }
        state: { enum: [RUNNING, COMPLETED, PAUSED, BLOCKED, FAILED] }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        records_attempted: { type: integer, minimum: 0 }
        records_completed: { type: integer, minimum: 0 }
        records_needs_attention: { type: integer, minimum: 0 }
        stop_reason: { type: [string, "null"] }
